<!doctype html>
<html lang="sv" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Verktyg</title>
<meta name="description" content="Startsida som samlar och öppnar mina verktyg på GitHub.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<link rel="stylesheet" href="assets/theme.css">
<link rel="stylesheet" href="assets/app.css">
<script>
  /* Sätt temat före första målningen så det inte blinkar. */
  try {
    var t = localStorage.getItem('webstart:theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* localStorage kan vara blockerad */ }
</script>
</head>
<body>

<header class="topbar">
  <div class="topbar-inner">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">🧰</span>
      <span>Verktyg</span>
    </a>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 16 16" aria-hidden="true" width="15" height="15">
        <path fill="currentColor" d="M11.74 10.34a6 6 0 1 0-1.4 1.4l3.2 3.2a1 1 0 0 0 1.42-1.42zM7 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8"/>
      </svg>
      <input id="search" class="field search" type="search" placeholder="Sök verktyg…"
             autocomplete="off" spellcheck="false" aria-label="Sök verktyg">
      <kbd class="search-kbd" aria-hidden="true">/</kbd>
    </div>

    <div class="topbar-actions">
      <button id="theme-toggle" class="btn btn-icon" type="button" title="Växla ljust/mörkt tema">
        <span class="visually-hidden">Växla tema</span>
        <svg class="icon-moon" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M6.2 1.4A6.6 6.6 0 0 0 8 14.5a6.6 6.6 0 0 0 6.2-4.3 5.3 5.3 0 0 1-8-6.2q0-1.4.6-2.6a6.6 6.6 0 0 0-.6 0"/>
        </svg>
        <svg class="icon-sun" viewBox="0 0 16 16" width="16" height="16" aria-hidden="true">
          <path fill="currentColor" d="M8 0a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0V1a1 1 0 0 1 1-1m0 12a1 1 0 0 1 1 1v1a1 1 0 0 1-2 0v-1a1 1 0 0 1 1-1m8-4a1 1 0 0 1-1 1h-1a1 1 0 0 1 0-2h1a1 1 0 0 1 1 1M3 8a1 1 0 0 1-1 1H1a1 1 0 0 1 0-2h1a1 1 0 0 1 1 1m10.7-5.7a1 1 0 0 1 0 1.4l-.7.7a1 1 0 1 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0M4.4 11.6a1 1 0 0 1 0 1.4l-.7.7a1 1 0 0 1-1.4-1.4l.7-.7a1 1 0 0 1 1.4 0m9.3 2.1a1 1 0 0 1-1.4 0l-.7-.7a1 1 0 0 1 1.4-1.4l.7.7a1 1 0 0 1 0 1.4M4.4 4.4A1 1 0 0 1 3 4.4l-.7-.7a1 1 0 0 1 1.4-1.4l.7.7a1 1 0 0 1 0 1.4M8 4.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7"/>
        </svg>
      </button>
      <a class="btn" href="admin.html">Hantera</a>
    </div>
  </div>
</header>

<main class="wrap" id="main">
  <div id="status" class="status" role="status" aria-live="polite"></div>
  <div id="content"></div>
</main>

<footer class="wrap foot">
  <span id="count" class="foot-count"></span>
  <span class="foot-hint">
    <kbd>/</kbd> sök · <kbd>↑</kbd><kbd>↓</kbd> bläddra · <kbd>Enter</kbd> öppna
  </span>
</footer>

<script type="module" src="assets/app.js"></script>
</body>
</html>
