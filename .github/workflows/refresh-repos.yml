name: Uppdatera repolistan

on:
  schedule:
    # Varje natt 04:17 UTC. Udda minut för att undvika toppen av timmen.
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-repos
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Hämta publika repon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/refresh-repos.mjs

      - name: Committa om något ändrats
        run: |
          if git diff --quiet -- data/repos.json; then
            echo "Inget har ändrats sedan förra körningen."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "Uppdatera ögonblicksbilden av repolistan"
          git push
